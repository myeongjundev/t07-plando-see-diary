services:
  - type: web
    # T07 continues on T06's service and T06's database rather than standing up
    # new ones: the URL stays, and the T06 rows are already in the right place
    # for the claim in T07-C100, with no dump and restore.
    #
    # The cost is paid once, in ordering. Repointing this service at the T07
    # repository turns https://t06-plando-see-diary.onrender.com into a login
    # screen, and T06's criteria want that URL to open without one. So T06 must
    # be submitted BEFORE the repoint. See docs/T07-ARCHITECTURE.md section 0.
    name: t06-plando-see-diary
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/live
    envVars:
      - key: REQUIRE_POSTGRES
        value: "1"
      - key: DATABASE_URL
        sync: false
      # Access-token signing key. Render generates it, so the value has never
      # existed in git, on a laptop, or in a chat transcript -- which is what
      # T07-C113 asks us to show. Rotating it invalidates live access tokens;
      # refresh sessions survive and clients recover on their next rotation.
      - key: JWT_SECRET
        generateValue: true
      # Key for HMAC-hashing client IPs before they are stored. Separate from
      # JWT_SECRET on purpose: rotating the signing key to invalidate access
      # tokens must not also reset every login-throttle window, and rotating
      # this one does reset them -- which is a runbook line, not a surprise.
      # Raw addresses are never written; a leaked table must not be a visitor log.
      - key: IP_HASH_SECRET
        generateValue: true
      # One-off commands on Render Free: the plan has no shell, no SSH, no
      # one-off jobs and no cron, so the only code that ever runs on the
      # instance is this web service. deploy/start.sh reads BOOT_TASK at boot
      # and runs the named script in the background, bracketed in the log.
      # Flip it here, push, read the log, flip it back to none, push again.
      # Known names: none | bench_password_hashing | claim_t06_data
      #
      # Armed for the repoint deploy. `claim_t06_data` is the one task that
      # changes data, so start.sh runs it synchronously and between two
      # migrations: up to a1c7d9e40b52 (accounts exist, ownership not yet
      # required), the claim, then the rest of the chain including the NOT NULL.
      # Set this back to `none` and push once the log says NULL=0.
      - key: BOOT_TASK
        value: "claim_t06_data"
      - key: BOOT_TASK_ARGS
        value: "--apply"
      # For BOOT_TASK=claim_t06_data. The two id lists must between them name
      # every plan that still has no owner: one the script cannot place stops
      # the boot rather than guessing, and the excluded ones are deleted, so
      # this is the list to read twice. Ids only -- they come from reading the
      # deployed table, not from matching titles.
      - key: CLAIM_PLAN_IDS
        value: "a0d06436-feb3-4323-9645-3ec53f283041,16ffc457-0a0e-42ff-bc9f-587e674815e4,7bda0448-07f1-4c0e-b407-0ee6b4c7d81c"
      - key: CLAIM_EXCLUDE_PLAN_IDS
        value: "32c69cbe-0717-48ad-a35c-0e0619da2637,7c3ec5f9-d652-4336-8af4-468ff6dec6ad,ec4f2f23-3311-435d-9925-f974ea585c2b,f396e61b-f895-437a-9ba7-f49c77d99bf5"
      # These two verification artifacts were already soft-deleted in T06.
      # The claim script refuses to delete an active task or a task outside a
      # plan selected above, so an id typo cannot remove live diary work.
      - key: CLAIM_EXCLUDE_TASK_IDS
        value: "8fbedf3d-446f-4670-afff-48798241c3e0,dd4f0a40-2439-4bb7-a12e-80a96943ff43"
      - key: CLAIM_EMAIL
        sync: false
      # Never an argument: BOOT_TASK_ARGS is committed here, and a command line
      # also lands in the process list and the boot log.
      - key: CLAIM_PASSWORD
        sync: false
      # The one plan the five-day observation is about. Set after the plan
      # exists, on day 1, from the id the study protocol records.
      #
      # It buys one rule and nothing else: on that plan, an execution on study
      # day 3 or later is refused until the rule change has been recorded
      # (T07-C09). Getting that order wrong is not repairable -- the ways back
      # are editing a timestamp or restarting the five days -- and the five days
      # are the tightest constraint in the schedule. Every other plan, the T06
      # rows included, is an ordinary diary this does not touch.
      #
      # Empty until then, and empty means the rule is off.
      - key: OBSERVATION_PLAN_ID
        sync: false
